<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Prediction Project{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">

</head>
<body>
<div class="bg-glow-blob blob-1"></div>
<div class="bg-glow-blob blob-2"></div>

<header class="topbar">

    <h1><a href="{{ url_for('index') }}">Placement Prediction Project</a></h1>
</header>

<div class="layout">
    <nav class="sidebar">
        <div class="sidebar-title">Pipeline Steps</div>
        <ul>

            <li>
                <a href="{{ url_for('index') }}" class="menu-item {% if active == 'none' %}active{% endif %}">
                    Home Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('data_loading') }}" class="menu-item {% if active == 'data-loading' %}active{% endif %}">
                    Data Loading
                </a>
            </li>
            <li>
                <a href="{{ url_for('preprocessing_route') }}" class="menu-item {% if active == 'preprocessing' %}active{% endif %}">
                    Preprocessing
                </a>
            </li>
            <li>
                <a href="{{ url_for('eda_route') }}" class="menu-item {% if active == 'eda' %}active{% endif %}">
                    Exploratory Analysis
                </a>
            </li>

            <li>
                <a href="{{ url_for('linear_regression_route') }}" class="menu-item {% if active == 'linear-regression' %}active{% endif %}">
                    Linear Regression
                </a>
            </li>
            <li class="menu-item disabled">
                Prediction (coming soon)
            </li>
        </ul>
    </nav>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>
</div>

</body>
</html>
